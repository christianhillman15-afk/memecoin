<!DOCTYPE html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0}
  html,body{width:400px;height:400px;overflow:hidden;background:#05080d}
  .tile{width:400px;height:400px;position:relative;
    background:radial-gradient(120% 120% at 50% 38%, #0c1726 0%, #070c15 55%, #03050b 100%)}
  /* faint grid */
  .tile::before{content:"";position:absolute;inset:0;opacity:.5;
    background:
      repeating-linear-gradient(0deg, rgba(55,214,214,.06) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(55,214,214,.06) 0 1px, transparent 1px 28px);
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 60%, transparent 78%)}
  .tile::after{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.55) 100%)}
  svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style></head>
<body>
  <div class="tile">
  <svg width="300" height="300" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#19e3a4"/><stop offset="1" stop-color="#37d6d6"/>
      </linearGradient>
      <radialGradient id="sweep" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#19e3a4" stop-opacity=".0"/>
        <stop offset="1" stop-color="#19e3a4" stop-opacity=".85"/>
      </radialGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    </defs>
    <!-- faint rings -->
    <circle cx="100" cy="100" r="40" fill="none" stroke="#37d6d6" stroke-opacity=".30" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="64" fill="none" stroke="#37d6d6" stroke-opacity=".22" stroke-width="1.5"/>
    <!-- crosshair -->
    <line x1="6" y1="100" x2="194" y2="100" stroke="#37d6d6" stroke-opacity=".16" stroke-width="1.5"/>
    <line x1="100" y1="6" x2="100" y2="194" stroke="#37d6d6" stroke-opacity=".16" stroke-width="1.5"/>
    <!-- sweep wedge -->
    <path d="M100,100 L100,8 A92,92 0 0 1 175,55 Z" fill="url(#sweep)" opacity=".9" filter="url(#soft)"/>
    <!-- main ring -->
    <circle cx="100" cy="100" r="88" fill="none" stroke="url(#g)" stroke-width="9" filter="url(#glow)"/>
    <!-- blips -->
    <circle cx="148" cy="62" r="5" fill="#19e3a4" filter="url(#glow)"/>
    <circle cx="64" cy="138" r="4" fill="#37d6d6" filter="url(#glow)"/>
    <!-- center core -->
    <circle cx="100" cy="100" r="13" fill="url(#g)" filter="url(#glow)"/>
    <circle cx="100" cy="100" r="5" fill="#eafff7"/>
  </svg>
  </div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;
    background:radial-gradient(110% 110% at 50% 50%, #0c1828 0%, #060c16 52%, #03060c 100%)}
  .tile{position:fixed;inset:0;
    background:radial-gradient(110% 110% at 50% 50%, #0c1828 0%, #060c16 52%, #03060c 100%)}
  .tile::after{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%, transparent 62%, rgba(0,0,0,.5) 100%)}
  svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style></head>
<body>
  <div class="tile">
  <svg width="320" height="320" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#22f0ad"/><stop offset="1" stop-color="#37d6d6"/>
      </linearGradient>
      <radialGradient id="sweep" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#22f0ad" stop-opacity="0"/>
        <stop offset="1" stop-color="#22f0ad" stop-opacity=".9"/>
      </radialGradient>
      <radialGradient id="core" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#eafff7"/><stop offset=".55" stop-color="#22f0ad"/>
        <stop offset="1" stop-color="#15b07e"/>
      </radialGradient>
      <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur stdDeviation="4.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    </defs>

    <!-- tick marks around the dial -->
    <g stroke="#37d6d6" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round">
      <line x1="100" y1="9"  x2="100" y2="17"/>
      <line x1="191" y1="100" x2="183" y2="100"/>
      <line x1="100" y1="191" x2="100" y2="183"/>
      <line x1="9"   y1="100" x2="17"  y2="100"/>
    </g>
    <!-- faint inner dial -->
    <circle cx="100" cy="100" r="48" fill="none" stroke="#37d6d6" stroke-opacity=".28" stroke-width="1.6"/>
    <!-- sweep wedge -->
    <path d="M100,100 L100,16 A84,84 0 0 1 173,58 Z" fill="url(#sweep)" opacity=".95" filter="url(#soft)"/>
    <!-- main ring -->
    <circle cx="100" cy="100" r="82" fill="none" stroke="url(#g)" stroke-width="13" filter="url(#glow)"/>
    <!-- target blip -->
    <circle cx="150" cy="64" r="5.5" fill="#22f0ad" filter="url(#glow)"/>
    <!-- core -->
    <circle cx="100" cy="100" r="16" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="100" cy="100" r="6" fill="#f3fffb"/>
  </svg>
  </div>
</body></html>

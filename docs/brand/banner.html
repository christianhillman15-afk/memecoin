<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1500px;height:500px;overflow:hidden;background:#05080d}
  .wrap{width:1500px;height:500px;position:relative;
    background:radial-gradient(90% 160% at 72% 30%, #0d1a2c 0%, #070d18 50%, #03050b 100%)}
  /* perspective grid */
  .grid{position:absolute;left:0;right:0;bottom:-40%;height:120%;
    transform:perspective(420px) rotateX(64deg);transform-origin:bottom;
    background:
      repeating-linear-gradient(90deg, rgba(55,214,214,.16) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(0deg, rgba(25,227,164,.14) 0 1px, transparent 1px 46px);
    -webkit-mask-image:linear-gradient(transparent, #000 50%);opacity:.55}
  .vig{position:absolute;inset:0;background:radial-gradient(80% 120% at 50% 40%, transparent 50%, rgba(0,0,0,.6) 100%)}
  /* big faint radar on the right */
  .radar{position:absolute;right:-90px;top:50%;transform:translateY(-50%);width:520px;height:520px;border-radius:50%;
    border:1px solid rgba(55,214,214,.18);opacity:.8}
  .radar::before{content:"";position:absolute;inset:90px;border-radius:50%;border:1px solid rgba(55,214,214,.14)}
  .radar::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 200deg, rgba(25,227,164,.45), rgba(25,227,164,.05) 40deg, transparent 90deg)}
  /* lockup — kept clear of the bottom-left avatar zone */
  .lockup{position:absolute;left:120px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:38px;z-index:3}
  .mark{width:150px;height:150px;flex:none;filter:drop-shadow(0 0 26px rgba(25,227,164,.5))}
  .txt{display:flex;flex-direction:column;gap:14px}
  .word{font-family:'Orbitron',system-ui,sans-serif;font-weight:900;font-size:104px;letter-spacing:.10em;line-height:.9;
    background:linear-gradient(180deg,#ffffff 0%,#c4f7e7 52%,#19e3a4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(25,227,164,.4))}
  .tag{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:25px;letter-spacing:.04em;color:#d8efe6}
  .tag .d{color:#19e3a4}
  .sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:400;font-size:18px;letter-spacing:.22em;
    text-transform:uppercase;color:#5d6b82;margin-top:2px}
  .handle{position:absolute;right:56px;top:44px;z-index:9;font-family:'JetBrains Mono',ui-monospace,monospace;
    font-weight:700;font-size:26px;letter-spacing:.04em;color:#19e3a4;
    padding:8px 16px;border:1px solid rgba(25,227,164,.4);border-radius:999px;
    background:rgba(25,227,164,.08);text-shadow:0 0 18px rgba(25,227,164,.45)}
</style></head>
<body>
  <div class="wrap">
    <div class="grid"></div>
    <div class="radar"></div>
    <div class="vig"></div>
    <div class="handle">@Trenchrapp</div>
    <div class="lockup">
      <svg class="mark" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19e3a4"/><stop offset="1" stop-color="#37d6d6"/></linearGradient>
          <radialGradient id="sweep" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#19e3a4" stop-opacity="0"/><stop offset="1" stop-color="#19e3a4" stop-opacity=".85"/></radialGradient>
        </defs>
        <circle cx="100" cy="100" r="40" fill="none" stroke="#37d6d6" stroke-opacity=".3" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="64" fill="none" stroke="#37d6d6" stroke-opacity=".22" stroke-width="1.5"/>
        <line x1="10" y1="100" x2="190" y2="100" stroke="#37d6d6" stroke-opacity=".16" stroke-width="1.5"/>
        <line x1="100" y1="10" x2="100" y2="190" stroke="#37d6d6" stroke-opacity=".16" stroke-width="1.5"/>
        <path d="M100,100 L100,8 A92,92 0 0 1 175,55 Z" fill="url(#sweep)" opacity=".9"/>
        <circle cx="100" cy="100" r="88" fill="none" stroke="url(#g)" stroke-width="9"/>
        <circle cx="148" cy="62" r="5" fill="#19e3a4"/><circle cx="64" cy="138" r="4" fill="#37d6d6"/>
        <circle cx="100" cy="100" r="13" fill="url(#g)"/><circle cx="100" cy="100" r="5" fill="#eafff7"/>
      </svg>
      <div class="txt">
        <div class="word">TRENCHR</div>
        <div class="tag">Track the cabals<span class="d"> · </span>catch the pumps<span class="d"> · </span>sell before the dump</div>
        <div class="sub">Solana pump/dump radar · paper-trading desk</div>
      </div>
    </div>
  </div>
</body></html>
